<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0714" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Kuch Toh Gadbad Hai</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <button id="pauseBtn" aria-label="Pause">&#10074;&#10074;</button>
  <div id="rotate">&#8635; Rotate to landscape for the best view</div>

  <div id="controls">
    <div class="pad">
      <button class="ctrl" id="btn-left" aria-label="Left">&#9664;</button>
      <button class="ctrl" id="btn-right" aria-label="Right">&#9654;</button>
    </div>
    <div class="actions">
      <button class="ctrl act jump" id="btn-jump" aria-label="Jump">JUMP</button>
      <button class="ctrl act special" id="btn-special" aria-label="Special">&#9733;</button>
      <button class="ctrl act punch" id="btn-punch" aria-label="Punch">PUNCH</button>
    </div>
  </div>

  <div id="overlay">
    <h1 id="ov-title">KUCH TOH GADBAD HAI</h1>
    <p id="ov-sub">A CID meme brawler</p>
    <div id="ov-buttons"></div>
    <p class="hint">Move &#9664; &#9654; &middot; Punch J &middot; Jump K/Space &middot; Special L &middot; Pause P</p>
  </div>

  <script src="./custom-config.js"></script>
  <script src="./core.js"></script>
  <script src="./art.js"></script>
  <script src="./levels.js"></script>
  <script src="./logic.js"></script>
  <script src="./main.js"></script>
</body>
</html>
